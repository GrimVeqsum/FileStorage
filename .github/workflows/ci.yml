name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...
      - name: Validate Compose
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file /dev/null -f docker-compose.test.yml config --quiet
      - name: Build application image
        run: docker build --tag filestorage-ci:${{ github.sha }} .
      - name: Integration tests with PostgreSQL and MinIO
        run: ./scripts/test-integration.sh -race -v
